<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Фотогалерея — CSS Grid</title>
  <link rel="stylesheet" href="style1.css" />
</head>
<body>
  <main class="gallery-wrapper">
    <section class="gallery" aria-label="Галерея фотографій">
      <!-- Верхній ряд: 5 фото -->
      <figure class="gallery__item">
        <img src="https://picsum.photos/id/1015/600/400" alt="Пейзаж 1" />
      </figure>
      <figure class="gallery__item">
        <img src="https://picsum.photos/id/1018/600/400" alt="Пейзаж 2" />
      </figure>
      <figure class="gallery__item">
        <img src="https://picsum.photos/id/1019/600/400" alt="Пейзаж 3" />
      </figure>
      <figure class="gallery__item">
        <img src="https://picsum.photos/id/1025/600/400" alt="Кадр 4" />
      </figure>
      <figure class="gallery__item">
        <img src="https://picsum.photos/id/1039/600/400" alt="Пейзаж 5" />
      </figure>

      <!-- Центральний широкий банер -->
      <figure class="gallery__item gallery__item--featured">
        <img src="https://picsum.photos/id/1016/1600/500" alt="Широкий панорамний кадр" />
      </figure>

      <!-- Нижній ряд: 5 фото -->
      <figure class="gallery__item">
        <img src="https://picsum.photos/id/1043/600/400" alt="Кадр 7" />
      </figure>
      <figure class="gallery__item">
        <img src="https://picsum.photos/id/1047/600/400" alt="Архітектура 8" />
      </figure>
      <figure class="gallery__item">
        <img src="https://picsum.photos/id/1050/600/400" alt="Природа 9" />
      </figure>
      <figure class="gallery__item">
        <img src="https://picsum.photos/id/1060/600/400" alt="Кадр 10" />
      </figure>
      <figure class="gallery__item">
        <img src="https://picsum.photos/id/1067/600/400" alt="Пейзаж 11" />
      </figure>
    </section>
  </main>
</body>
</html>
