<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Завдання 6 — Деревовидна структура (CSS Grid)</title>
  <link rel="stylesheet" href="style4.css" />
</head>
<body>
  <main class="page">
    <div class="tree-grid">
      <!-- Колонка 1 (1 блок) -->
      <div class="node node--c1"></div>

      <!-- Колонка 2 (2 блоки) -->
      <div class="node node--c2"></div>
      <div class="node node--c2"></div>

      <!-- Колонка 3 (3 блоки) -->
      <div class="node node--c3"></div>
      <div class="node node--c3"></div>
      <div class="node node--c3"></div>

      <!-- Колонка 4 (4 блоки) -->
      <div class="node node--c4"></div>
      <div class="node node--c4"></div>
      <div class="node node--c4"></div>
      <div class="node node--c4"></div>

      <!-- Колонка 5 (6 блоків) -->
      <div class="node node--c5"></div>
      <div class="node node--c5"></div>
      <div class="node node--c5"></div>
      <div class="node node--c5"></div>
      <div class="node node--c5"></div>
      <div class="node node--c5"></div>

      <!-- Колонка 6 (12 блоків) -->
      <div class="node node--c6"></div>
      <div class="node node--c6"></div>
      <div class="node node--c6"></div>
      <div class="node node--c6"></div>
      <div class="node node--c6"></div>
      <div class="node node--c6"></div>
      <div class="node node--c6"></div>
      <div class="node node--c6"></div>
      <div class="node node--c6"></div>
      <div class="node node--c6"></div>
      <div class="node node--c6"></div>
      <div class="node node--c6"></div>
    </div>
  </main>
</body>
</html>
